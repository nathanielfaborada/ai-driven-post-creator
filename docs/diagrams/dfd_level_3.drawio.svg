<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1120px" height="540px" viewBox="-0.5 -0.5 1120 540" style="background-color: #0f172a;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Top Ingestion Node -->
  <rect x="360" y="30" width="400" height="70" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#shadow3)"/>
  <text x="560" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Ingest Video Buffer from Telegram Bot API</text>
  <text x="560" y="80" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">(Validate 20MB bot limit &amp; Stream binary bytes)</text>

  <!-- Track A: Facebook Reels -->
  <rect x="40" y="160" width="320" height="190" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2" filter="url(#shadow3)"/>
  <text x="200" y="195" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Track A: Facebook Reels (3-Phase)</text>
  
  <rect x="60" y="215" width="280" height="35" rx="6" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
  <text x="200" y="237" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Phase 1: POST /{pageId}/video_reels (start)</text>

  <rect x="60" y="260" width="280" height="35" rx="6" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
  <text x="200" y="282" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Phase 2: POST upload_url (Stream binary)</text>

  <rect x="60" y="305" width="280" height="35" rx="6" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
  <text x="200" y="327" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Phase 3: POST /{pageId}/video_reels (finish)</text>

  <!-- Track B: YouTube Shorts -->
  <rect x="400" y="160" width="320" height="190" rx="14" fill="#1e293b" stroke="#f87171" stroke-width="2" filter="url(#shadow3)"/>
  <text x="560" y="195" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Track B: YouTube Shorts (Stream)</text>
  
  <rect x="420" y="225" width="280" height="45" rx="6" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
  <text x="560" y="245" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Create stream.PassThrough(videoBuffer)</text>
  <text x="560" y="260" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">(Pipe binary into OAuth2 Client)</text>

  <rect x="420" y="285" width="280" height="45" rx="6" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
  <text x="560" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">POST /videos.insert (Category 28)</text>
  <text x="560" y="320" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">(Tags, SEO &amp; #Shorts Categorization)</text>

  <!-- Track C: TikTok Video -->
  <rect x="760" y="160" width="320" height="190" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#shadow3)"/>
  <text x="920" y="195" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Track C: TikTok Video (2-Phase)</text>
  
  <rect x="780" y="225" width="280" height="45" rx="6" fill="#831843" stroke="#ec4899" stroke-width="1"/>
  <text x="920" y="245" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Phase 1: POST /v2/post/publish/video/init/</text>
  <text x="920" y="260" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">(Get upload_url &amp; publish_id)</text>

  <rect x="780" y="285" width="280" height="45" rx="6" fill="#831843" stroke="#ec4899" stroke-width="1"/>
  <text x="920" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Phase 2: PUT upload_url</text>
  <text x="920" y="320" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">(Content-Range binary bytes)</text>

  <!-- Bottom Consolidation Node -->
  <rect x="260" y="410" width="600" height="80" rx="14" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow3)"/>
  <text x="560" y="445" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Consolidate Publish IDs (FB Video ID, YT ID, TikTok Publish ID)</text>
  <text x="560" y="470" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">Archive to Telegram Category Channel &amp; Delete from Queue Channel</text>

  <!-- Connectors -->
  <!-- Top to Tracks -->
  <path d="M 440 100 L 200 160" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M 560 100 L 560 160" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <path d="M 680 100 L 920 160" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#arr-pink)"/>

  <!-- Tracks to Bottom -->
  <path d="M 200 350 L 380 410" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 560 350 L 560 410" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 920 350 L 740 410" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
</svg>
