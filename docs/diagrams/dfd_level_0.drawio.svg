<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1120px" height="680px" viewBox="-0.5 -0.5 1120 680" style="background-color: #0f172a;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="grad-engine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Central Engine -->
  <rect x="420" y="270" width="280" height="140" rx="16" fill="url(#grad-engine)" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
  <text x="560" y="325" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">AI-Driven Multi-Platform</text>
  <text x="560" y="350" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Automation Engine</text>
  <text x="560" y="378" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" text-anchor="middle">(Node.js Core Controller)</text>

  <!-- External Entity: Creator -->
  <rect x="50" y="60" width="220" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Content Creator</text>
  <text x="160" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(Drops Videos &amp; Topic Hints)</text>

  <!-- External Entity: Telegram Bot API -->
  <rect x="50" y="300" width="220" height="80" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="335" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Telegram Bot API</text>
  <text x="160" y="360" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(Queue &amp; 10 Archive Channels)</text>

  <!-- External Entity: Gemini AI Pool -->
  <rect x="450" y="50" width="220" height="80" rx="12" fill="#4338ca" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Google Gemini AI Pool</text>
  <text x="560" y="110" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(10-Key Pool / Model Fallback)</text>

  <!-- External Entity: Audience -->
  <rect x="850" y="60" width="220" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Audience &amp; Viewers</text>
  <text x="960" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(Comments &amp; Messenger DMs)</text>

  <!-- External Entity: YouTube Data API -->
  <rect x="850" y="300" width="220" height="80" rx="12" fill="#991b1b" stroke="#f87171" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="335" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">YouTube Data API v3</text>
  <text x="960" y="360" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(Shorts / videos.insert)</text>

  <!-- External Entity: Meta Graph API -->
  <rect x="50" y="520" width="220" height="80" rx="12" fill="#1e40af" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="555" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Meta Graph API v26.0</text>
  <text x="160" y="580" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(FB Reels, Feed &amp; Comments)</text>

  <!-- External Entity: Supabase Cloud DB -->
  <rect x="450" y="520" width="220" height="80" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="555" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Supabase Cloud DB</text>
  <text x="560" y="580" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(reels_queue &amp; reels_archive)</text>

  <!-- External Entity: TikTok Content API -->
  <rect x="850" y="520" width="220" height="80" rx="12" fill="#831843" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="555" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TikTok Content API v2</text>
  <text x="960" y="580" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">(/post/publish/video/init/)</text>

  <!-- Connecting Arrows & Flow Labels -->
  <!-- Creator -> Telegram -->
  <path d="M 160 140 L 160 300" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="170" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Uploads Video &amp; Hints</text>

  <!-- Telegram -> Central Engine -->
  <path d="M 270 340 L 420 340" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="330" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Long-Polling &amp; Video Streams</text>

  <!-- Central Engine -> Gemini -->
  <path d="M 560 270 L 560 130" stroke="#818cf8" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="570" y="200" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Prompts &amp; AI Inference</text>

  <!-- Central Engine -> Supabase -->
  <path d="M 560 410 L 560 520" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="570" y="470" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">CRUD State Sync</text>

  <!-- Central Engine -> Meta -->
  <path d="M 460 410 L 230 520" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="320" y="490" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">1. Post FB Reels &amp; Replies</text>

  <!-- Central Engine -> YouTube -->
  <path d="M 700 340 L 850 340" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="775" y="330" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">2. Cross-Post Shorts</text>

  <!-- Central Engine -> TikTok -->
  <path d="M 660 410 L 870 520" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#arrow-pink)"/>
  <text x="800" y="480" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">3. Cross-Post Videos</text>

  <!-- Audience -> Central Engine -->
  <path d="M 850 120 L 670 270" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="790" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Comments &amp; DMs</text>
</svg>
