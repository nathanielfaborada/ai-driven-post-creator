<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1120px" height="520px" viewBox="-0.5 -0.5 1120 520" style="background-color: #0f172a;">
  <defs>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Subsystem 1: Ingestion & Router -->
  <rect x="50" y="60" width="280" height="120" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#shadow1)"/>
  <text x="190" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1.0 Ingestion &amp; Router</text>
  <text x="190" y="130" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">Telegram Long-Polling &amp; Classifier</text>
  <text x="190" y="150" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">(Queue &amp; 10-Channel Archives)</text>

  <!-- Data Store D1: reels_queue -->
  <rect x="440" y="50" width="240" height="65" rx="10" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow1)"/>
  <text x="560" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">D1: reels_queue</text>
  <text x="560" y="100" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Pending FIFO Ingestion Table</text>

  <!-- Data Store D2: reels_archive -->
  <rect x="440" y="135" width="240" height="65" rx="10" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow1)"/>
  <text x="560" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">D2: reels_archive</text>
  <text x="560" y="185" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">10-Category Evergreen Library</text>

  <!-- Subsystem 3: Scheduling Orchestrator -->
  <rect x="50" y="320" width="280" height="120" rx="14" fill="#b45309" stroke="#fbbf24" stroke-width="2" filter="url(#shadow1)"/>
  <text x="190" y="365" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3.0 24/7 Schedulers</text>
  <text x="190" y="390" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">node-schedule Crons &amp; Workers</text>
  <text x="190" y="410" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">(Reels 4h, Posts 5h, Comments 2m)</text>

  <!-- Subsystem 4: AI Intelligence Engine -->
  <rect x="420" y="320" width="280" height="120" rx="14" fill="#4338ca" stroke="#818cf8" stroke-width="2" filter="url(#shadow1)"/>
  <text x="560" y="365" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4.0 AI Intelligence Engine</text>
  <text x="560" y="390" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">10-Key Pool / Model Fallback</text>
  <text x="560" y="410" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">(SEO Captions, Unicode Bolder)</text>

  <!-- Subsystem 5: Triple Social Distribution -->
  <rect x="790" y="320" width="280" height="120" rx="14" fill="#9d174d" stroke="#f472b6" stroke-width="2" filter="url(#shadow1)"/>
  <text x="930" y="365" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">5.0 Triple Social Distribution</text>
  <text x="930" y="390" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">FB Reels + YT Shorts + TikTok</text>
  <text x="930" y="410" fill="#fdf2f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">(Parallel Multi-API Dispatchers)</text>

  <!-- Flow Lines -->
  <!-- S1 -> D1 -->
  <path d="M 330 90 L 440 75" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-sky)"/>
  <text x="385" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Queue FIFO</text>

  <!-- S1 -> D2 -->
  <path d="M 330 140 L 440 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-sky)"/>
  <text x="385" y="165" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Direct Seed</text>

  <!-- D1/D2 -> S3 -->
  <path d="M 440 180 L 330 340" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-emerald)"/>
  <text x="340" y="270" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10">Fetch Video Candidate</text>

  <!-- S3 -> S4 -->
  <path d="M 330 380 L 420 380" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="375" y="370" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Job Trigger</text>

  <!-- S4 -> S5 -->
  <path d="M 700 380 L 790 380" stroke="#818cf8" stroke-width="2" fill="none" marker-end="url(#arrow-indigo)"/>
  <text x="745" y="370" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Payload</text>
</svg>
